<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VectisDHG">
<meta name="theme-color" content="#1d4ed8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>VectisDHG Compagnon</title>
<style>
:root{
  --bg:#f1f5f9; --card:#fff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --brand:#1d4ed8; --brand-soft:#e8eefc; --ok:#15803d; --ok-bg:#dcfce7; --bad:#b91c1c; --bad-bg:#fee2e2; --warn:#b45309; --warn-bg:#fef3c7;
  --postit:#fff3a3; --postit-line:#e0c200; --nav-h:58px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0b1220; --card:#162033; --text:#e5eaf3; --muted:#93a1b8; --line:#26334a; --brand:#7aa2ff; --brand-soft:#1d2a4a;
    --ok:#4ade80; --ok-bg:#12351f; --bad:#fca5a5; --bad-bg:#3b1618; --warn:#fbbf24; --warn-bg:#3a2a0b; --postit:#4a4210; --postit-line:#a08a00; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px)}
header.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px;min-height:52px}
header.top h1{font-size:1.05rem;margin:0;flex:1;line-height:1.2}
header.top small{display:block;font-weight:500;color:var(--muted);font-size:.74rem}
.back{border:0;background:var(--brand-soft);color:var(--brand);font-size:1rem;border-radius:10px;padding:8px 12px;font-weight:700}
main{padding:12px 16px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi span{display:block;font-size:.74rem;color:var(--muted)}
.kpi strong{font-size:1.45rem;display:block;margin-top:2px}
.kpi small{color:var(--muted);font-size:.74rem}
.kpi.wide{grid-column:1/-1}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:6px}
.bar i.over{background:var(--bad)}
.row{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:650;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:.8rem;color:var(--muted)}
.row .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:650}
.chev{color:var(--muted)}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.78rem;font-weight:700}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-bad{background:var(--bad-bg);color:var(--bad)} .b-warn{background:var(--warn-bg);color:var(--warn)} .b-gray{background:var(--line);color:var(--muted)}
.chip{display:inline-block;background:var(--brand-soft);color:var(--brand);border-radius:8px;padding:1px 8px;font-size:.75rem;font-weight:700;margin-right:6px}
.alert{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);align-items:flex-start;cursor:pointer}
.alert:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)}
input[type=search],input.txt{width:100%;font-size:1rem;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);margin-bottom:10px}
.postit{background:var(--postit);border:1px solid var(--postit-line);border-radius:6px 6px 14px 6px;padding:10px 12px;margin-bottom:12px;box-shadow:0 3px 8px rgba(0,0,0,.12);color:#3b3300}
@media (prefers-color-scheme: dark){.postit{color:#f4e9a0}}
.postit h3{margin:0 0 6px;font-size:.9rem;display:flex;gap:8px;align-items:center}
.postit h3 .mod{font-size:.7rem;background:#f97316;color:#fff;border-radius:999px;padding:1px 8px}
.postit textarea{width:100%;min-height:96px;border:0;background:transparent;font:inherit;font-size:1rem;color:inherit;resize:vertical;outline:none}
.postit .ph{font-size:.75rem;opacity:.7}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;color:var(--muted);padding:7px 2px 6px;font-size:.68rem;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:var(--nav-h);position:relative}
.nav button b{font-size:1.25rem;line-height:1.2}
.nav button.on{color:var(--brand);font-weight:700}
.nav .pip{position:absolute;top:6px;right:calc(50% - 22px);background:#f97316;color:#fff;border-radius:999px;font-size:.62rem;padding:0 6px;font-weight:700}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:1rem;font-weight:700;background:var(--brand);color:#fff;margin-bottom:10px}
.btn.sec{background:var(--brand-soft);color:var(--brand)}
.btn.dng{background:var(--bad-bg);color:var(--bad)}
.btn:disabled{opacity:.45}
.note{font-size:.82rem;color:var(--muted);margin:6px 0 12px}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.empty b{display:block;font-size:2.4rem;margin-bottom:6px}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t td,table.t th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px;font-size:.88rem;color:var(--muted);font-weight:600}
.seg button.on{background:var(--card);color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);background:#0f172a;color:#fff;padding:9px 16px;border-radius:999px;font-size:.85rem;z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:.95}
input.txt{margin-bottom:12px}
.lbl{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin:2px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.err{color:var(--bad);font-size:.85rem;min-height:1.2em;margin-bottom:8px}
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet-card{position:relative;background:var(--card);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.sh-head strong{font-size:1.02rem}
.sumbox{display:flex;gap:10px;margin-bottom:12px}
.sumbox>div{flex:1;background:var(--bg);border-radius:12px;padding:9px 11px}
.sumbox span{display:block;font-size:.72rem;color:var(--muted)}
.sumbox strong{display:block;font-size:1.02rem;margin:1px 0 3px}
.srow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.sname{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.sval{font-variant-numeric:tabular-nums;font-weight:650}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border:0;border-radius:12px;background:var(--brand-soft);color:var(--brand);font-size:1.5rem;font-weight:700;line-height:1}
.stepper input{width:70px;height:44px;text-align:center;font-size:1.1rem;font-weight:700;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font-variant-numeric:tabular-nums}
.hidden{display:none!important}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="main"></main>
<nav class="nav" id="nav"></nav>
<input type="file" id="fileInput" accept=".json,application/json" class="hidden">
<div class="sheet hidden" id="sheet"><div class="sheet-bg" onclick="closeSheet()"></div><div class="sheet-card" id="sheetCard"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
// ───────── État ─────────
const LS_KEY = 'vectis.compagnon.v1';
let obj = null;                 // JSON complet de l'application (conservé tel quel, seuls les post-it changent)
let fileName = '';
let loadedAt = '';
let journal = [];               // modifications faites sur le téléphone (rejouées sur l'ordinateur)
let ui = { tab: 'home', disc: null, teacher: null, discTab: 'services', q: '', tq: '' };

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => parseFloat(v) || 0;
const fr = (v, d = 2) => (Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).toLocaleString('fr-FR', { minimumFractionDigits: 0, maximumFractionDigits: d });
function fh(v, data, signed) {
  v = v || 0;
  if (data && data.hoursFormat === 'sexa') {
    const tm = Math.round(Math.abs(v) * 60), h = Math.floor(tm / 60), m = tm % 60;
    const sg = (v < 0 && tm > 0) ? '-' : ((signed && tm > 0) ? '+' : '');
    return `${sg}${h}h${String(m).padStart(2, '0')}`;
  }
  return `${signed && v > 0 ? '+' : ''}${fr(v)} h`;
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200); }

// ───────── Persistance locale (sans serveur) ─────────
function persist() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ obj, fileName, loadedAt, journal })); }
  catch (e) { /* stockage indisponible : l'app fonctionne en mémoire */ }
}
function restore() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (s && s.obj && s.obj.dataStore) { obj = s.obj; fileName = s.fileName || ''; loadedAt = s.loadedAt || ''; journal = Array.isArray(s.journal) ? s.journal : []; }
  } catch (e) {}
}

// ───────── Calculs (reprise de ceux de l'application) ─────────
const store = () => (obj && obj.dataStore) || {};
const levelsList = () => (obj && Array.isArray(obj.levels)) ? obj.levels : [];
const pondOn = () => {
  const id = obj && obj.epleIdentity;
  if (!id) return false;
  if (id.enablePonderations !== undefined) return !!id.enablePonderations;
  return Object.values(store()).some(d => d && Array.isArray(d.services) && d.services.some(s => s.ponderationActive));
};
function svcLevels(s) {
  if (!s.isOptionnel && s.level) return [s.level];
  if (Array.isArray(s.levels) && s.levels.length) return s.levels;
  return s.level ? [s.level] : ['Non défini'];
}
function crossListed(disc) {
  const out = [];
  Object.keys(store()).forEach(od => {
    if (od === disc) return;
    (store()[od].services || []).forEach((s, si) => {
      if (s.isOptionnel && Array.isArray(s.assignedDisciplines) && s.assignedDisciplines.includes(disc)) out.push({ sv: s, od, si });
    });
  });
  return out;
}
function pondExtra(sums, t, data) {
  if (!pondOn()) return 0;
  const ors = (data.apports && data.apports[t] !== undefined) ? num(data.apports[t]) : 18;
  const h11 = Math.min((sums[t] || 0) / 0.1, 10);
  let weighted = Math.max(h11, 0), pond = Math.max(h11, 0) * 0.1;
  const h125 = sums['125:' + t] || 0; weighted += h125; pond += h125 * 0.25;
  const others = sums['x:' + t] || {};
  Object.keys(others).forEach(k => { weighted += others[k]; pond += others[k] * (parseFloat(k) - 1); });
  if (weighted > ors && weighted > 0) pond = pond * Math.max(ors, 0) / weighted;
  return pond;
}
function teacherSummary(disc, t) {
  const data = store()[disc];
  const services = (data.services || []).map((sv, si) => ({ sv, od: disc, si })).concat(crossListed(disc));
  const sums = {}; sums[t] = 0;
  let raw = 0; const rows = [];
  services.forEach(({ sv, od, si }) => {
    const v = num(sv.allocations && sv.allocations[t]);
    if (!(v > 0)) return;
    raw += v;
    const f = sv.ponderationActive ? (num(sv.ponderationFactor) || 1.1) : 1;
    if (sv.ponderationActive) {
      if (Math.abs(f - 1.25) < 0.01) sums['125:' + t] = (sums['125:' + t] || 0) + v;
      else if (Math.abs(f - 1.1) < 0.01) sums[t] += v * 0.1;
      else { sums['x:' + t] = sums['x:' + t] || {}; sums['x:' + t][f] = (sums['x:' + t][f] || 0) + v; }
    }
    rows.push({ level: svcLevels(sv).join(', '), name: sv.name || '', hours: v, active: !!sv.ponderationActive, factor: f, od, si });
  });
  const pond = pondExtra(sums, t, data);
  const apport = (data.apports && data.apports[t] !== undefined) ? num(data.apports[t]) : 18;
  const ares = ((data.ares && Array.isArray(data.ares[t])) ? data.ares[t] : []).map(a => ({ label: a.label || a.short || 'ARE', hours: num(a.hours) }));
  const are = ares.reduce((x, a) => x + a.hours, 0);
  const total = raw + pond + are;
  return { rows, raw, pond, are, ares, total, apport, hsa: total - apport };
}
function discSummary(disc) {
  const data = store()[disc];
  let raw = 0, pond = 0, are = 0, hsa = 0, total = 0;
  (data.teachers || []).forEach(t => { const s = teacherSummary(disc, t); raw += s.raw; pond += s.pond; are += s.are; hsa += s.hsa; total += s.total; });
  const svcs = [];
  (data.services || []).forEach((sv, si) => {
    const target = num(sv.classes) * num(sv.hours);
    let done = 0; Object.values(sv.allocations || {}).forEach(v => { done += num(v); });
    const diff = Math.round((target - done) * 100) / 100;
    svcs.push({ sv, si, target, done, diff, co: !!sv.isCoEnseignement });
  });
  const todo = svcs.filter(x => !x.co && x.diff > 0.004).length;
  const over = svcs.filter(x => !x.co && x.diff < -0.004).length;
  return { raw, pond, are, hsa, total, svcs, todo, over };
}
function globalStats() {
  const hp = num(obj.dotation && obj.dotation.hp), hsa = num(obj.dotation && obj.dotation.hsa), dgh = hp + hsa;
  let used = 0, todoH = 0, nTodo = 0, nOver = 0; const alerts = [];
  Object.keys(store()).forEach(d => {
    const s = discSummary(d); used += s.total;
    s.svcs.forEach(x => {
      if (x.co) return;
      const lab = `${x.sv.name || '(sans intitulé)'}${x.sv.level ? ' (' + x.sv.level + ')' : ''}`;
      if (x.target > 0 && x.done === 0) { alerts.push({ sev: 'bad', disc: d, t: lab, m: `Aucune heure ventilée : ${fr(x.target)} h à attribuer` }); nTodo++; todoH += x.target; }
      else if (x.diff > 0.004) { alerts.push({ sev: 'bad', disc: d, t: lab, m: `Reste ${fr(x.diff)} h à ventiler` }); nTodo++; todoH += x.diff; }
      else if (x.diff < -0.004) { alerts.push({ sev: 'warn', disc: d, t: lab, m: `Sur-ventilé de ${fr(-x.diff)} h` }); nOver++; }
    });
  });
  return { hp, hsa, dgh, used, remaining: dgh - used, todoH, nTodo, nOver, alerts };
}
const noteOf = d => (store()[d] && store()[d].note) || '';
const nDirty = () => journal.length;

// ───────── Rendu ─────────
function go(patch) { Object.assign(ui, patch); render(); window.scrollTo(0, 0); }
function render() {
  const nav = $('nav');
  const tabs = [['home', '🏠', 'Accueil'], ['disc', '📚', 'Disciplines'], ['teach', '👤', 'Enseignants'], ['notes', '📝', 'Post-it'], ['file', '📂', 'Fichier']];
  nav.innerHTML = tabs.map(([k, ic, lb]) => `<button class="${ui.tab === k ? 'on' : ''}" onclick="go({tab:'${k}',disc:null,teacher:null})"><b>${ic}</b>${lb}${k === 'file' && nDirty() ? `<span class="pip">${nDirty()}</span>` : ''}</button>`).join('');
  const top = $('top'), main = $('main');
  if (!obj) { top.innerHTML = '<h1>VectisDHG Compagnon</h1>'; main.innerHTML = viewWelcome(); return; }
  const ep = (obj.epleIdentity && obj.epleIdentity.name) || 'Établissement';
  let title = ep, sub = 'VectisDHG Compagnon', back = '';
  let html = '';
  if (ui.tab === 'home') html = viewHome();
  else if (ui.tab === 'disc') {
    if (ui.disc) { title = ui.disc; sub = ep; back = `<button class="back" onclick="go({disc:null})">‹</button>`; html = viewDiscDetail(ui.disc); }
    else { title = 'Disciplines'; html = viewDiscList(); }
  } else if (ui.tab === 'teach') {
    if (ui.teacher) { title = ui.teacher.t; sub = ui.teacher.d; back = `<button class="back" onclick="go({teacher:null})">‹</button>`; html = viewTeacher(ui.teacher.d, ui.teacher.t); }
    else { title = 'Enseignants'; html = viewTeachList(); }
  } else if (ui.tab === 'notes') { title = 'Post-it'; html = viewNotes(); }
  else if (ui.tab === 'file') { title = 'Fichier'; html = viewFile(); }
  top.innerHTML = `${back}<h1>${esc(title)}<small>${esc(sub)}</small></h1>`;
  const keep = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.keep;
  main.innerHTML = html;
}
function viewWelcome() {
  return `<div class="empty"><b>📱</b><h2 style="margin:0 0 6px;color:var(--text)">Bienvenue</h2>
  Ouvrez une sauvegarde (.json) enregistrée depuis VectisDHG Autonomie pour la consulter et modifier vos post-it.</div>
  <button class="btn" onclick="$('fileInput').click()">📂 Ouvrir un fichier .json</button>
  <p class="note">Le fichier reste sur votre téléphone : rien n'est envoyé sur Internet.</p>`;
}
function viewHome() {
  const g = globalStats(), ep = obj.epleIdentity || {};
  const pct = g.dgh > 0 ? Math.min(100, g.used / g.dgh * 100) : 0, over = g.remaining < -0.004;
  const lab = over ? 'Dépassement' : 'Reste à utiliser';
  const al = g.alerts.slice(0, 8).map(a => `<div class="alert" onclick="go({tab:'disc',disc:${JSON.stringify(a.disc).replace(/"/g, '&quot;')}})"><span class="dot ${a.sev}"></span><div class="main"><div class="t" style="font-weight:650">${esc(a.t)}</div><div class="s" style="font-size:.8rem;color:var(--muted)">${esc(a.disc)} · ${esc(a.m)}</div></div></div>`).join('');
  const pend = nDirty() ? `<div class="card" style="background:var(--warn-bg);border-color:var(--warn);cursor:pointer" onclick="go({tab:'file'})"><strong style="color:var(--warn)">✏️ ${nDirty()} modification${nDirty() > 1 ? 's' : ''} à exporter</strong><div class="s" style="font-size:.8rem;color:var(--muted)">Touchez pour les exporter vers l'ordinateur.</div></div>` : '';
  return pend + `<div class="card" style="padding:10px 14px"><div style="font-weight:700">${esc(ep.name || '')}</div><div class="s" style="font-size:.8rem;color:var(--muted)">${[ep.uai, ep.commune].filter(Boolean).map(esc).join(' · ')}</div></div>
  <div class="kpis">
    <div class="kpi"><span>Dotation (DHG)</span><strong>${fr(g.dgh, 1)} h</strong><small>${fr(g.hp, 1)} HP + ${fr(g.hsa, 1)} HSA</small></div>
    <div class="kpi"><span>Heures ventilées</span><strong>${fr(g.used, 1)} h</strong><small>${pondOn() ? 'pond. et ARE compris' : 'ARE compris'}</small></div>
    <div class="kpi wide"><span>${lab}</span><strong style="color:var(${over ? '--bad' : '--ok'})">${over ? '+' : ''}${fr(Math.abs(g.remaining), 2)} h</strong>
      <div class="bar"><i class="${over ? 'over' : ''}" style="width:${pct}%"></i></div><small>${fr(g.dgh > 0 ? g.used / g.dgh * 100 : 0, 1)} % de la dotation utilisée</small></div>
  </div>
  <div class="card"><h2>À surveiller · ${g.nTodo} service${g.nTodo > 1 ? 's' : ''} à ventiler${g.nOver ? ` · ${g.nOver} sur-ventilé${g.nOver > 1 ? 's' : ''}` : ''}</h2>
    ${al || '<div class="empty" style="padding:12px">✅ Tous les services sont ventilés.</div>'}
    ${g.alerts.length > 8 ? `<div class="note">… et ${g.alerts.length - 8} autres (voir chaque discipline).</div>` : ''}</div>`;
}
function viewDiscList() {
  const names = Object.keys(store());
  if (!names.length) return '<div class="empty"><b>📚</b>Aucune discipline.</div>';
  return `<div class="card">${names.map(d => {

// ───────── Journal des modifications ─────────
const r2 = v => Math.round(num(v) * 100) / 100;
// Ajoute une modification ; fusionne avec la précédente de même cible tant qu'aucun ajout/renommage d'enseignant ne s'est intercalé
function logOp(op, key) {
  for (let i = journal.length - 1; i >= 0; i--) {
    const o = journal[i];
    if ((o.k === 'tadd' || o.k === 'trename') && o.disc === op.disc) break;
    if (opKey(o) === key) {
      o.to = op.to;
      const same = o.k === 'note' ? (o.from || '') === (o.to || '') : Math.abs(num(o.from) - num(o.to)) < 0.001;
      if (same) journal.splice(i, 1);
      return;
    }
  }
  journal.push(op);
}
function opKey(o) {
  if (o.k === 'note') return 'note|' + o.disc;
  if (o.k === 'alloc') return `alloc|${o.disc}|${o.sIndex}|${o.teacher}`;
  if (o.k === 'tors') return `tors|${o.disc}|${o.teacher}`;
  return null;
}
function save() { clearTimeout(save._t); save._t = setTimeout(() => { persist(); pip(); }, 250); }

function setNote(d, v) {
  const data = store()[d]; if (!data) return;
  const from = data.note || '';
  if (v.trim()) data.note = v; else delete data.note;
  if (from === (data.note || '')) return;
  logOp({ k: 'note', disc: d, from, to: data.note || '' }, 'note|' + d);
  save();
}
function onNote(ta) { setNote(ta.dataset.disc, ta.value); }

function setAlloc(od, si, teacher, val) {
  const sv = store()[od] && store()[od].services[si]; if (!sv) return;
  const from = r2(sv.allocations && sv.allocations[teacher]), to = Math.max(0, r2(val));
  if (from === to) return;
  if (!sv.allocations) sv.allocations = {};
  sv.allocations[teacher] = to;
  logOp({ k: 'alloc', disc: od, sIndex: si, svc: sv.name || '', level: sv.level || '', teacher, from, to }, `alloc|${od}|${si}|${teacher}`);
  save();
}
function orsOf(d, t) { const a = store()[d].apports; return (a && a[t] !== undefined) ? num(a[t]) : 18; }
function setOrs(d, t, val) {
  const data = store()[d]; const from = r2(orsOf(d, t)), to = Math.max(0, r2(val));
  if (from === to) return;
  if (!data.apports) data.apports = {};
  data.apports[t] = to;
  logOp({ k: 'tors', disc: d, teacher: t, from, to }, `tors|${d}|${t}`);
  save();
}
function addTeacherOp(d, name, ors) {
  const data = store()[d]; if (!data) return false;
  if (!Array.isArray(data.teachers)) data.teachers = [];
  if (!name || data.teachers.includes(name)) return false;
  data.teachers.push(name);
  if (!data.apports) data.apports = {};
  data.apports[name] = r2(ors);
  journal.push({ k: 'tadd', disc: d, name, ors: r2(ors) });
  save(); return true;
}
// Renommage : mêmes règles que l'application (allocations, ARE, ORS, options, coordonnateurs, co-enseignement)
function renameCore(disc, oldName, newName) {
  const data = store()[disc];
  if (!data || !data.teachers.includes(oldName) || data.teachers.includes(newName)) return false;
  data.teachers[data.teachers.indexOf(oldName)] = newName;
  ['ares', 'apports'].forEach(k => { if (data[k] && data[k][oldName] !== undefined) { data[k][newName] = data[k][oldName]; delete data[k][oldName]; } });
  Object.keys(store()).forEach(d => (store()[d].services || []).forEach(sv => {
    const concerned = d === disc || (Array.isArray(sv.assignedDisciplines) && sv.assignedDisciplines.includes(disc));
    if (!concerned) return;
    if (sv.allocations && Object.prototype.hasOwnProperty.call(sv.allocations, oldName)) { sv.allocations[newName] = sv.allocations[oldName]; delete sv.allocations[oldName]; }
    if (Array.isArray(sv.assignedTeachers)) sv.assignedTeachers = sv.assignedTeachers.map(t => t === oldName ? newName : t);
  }));
  (obj.coordinators || []).forEach(e => {
    if (!(e.discs || []).includes(disc)) return;
    if (e.teacher === oldName) e.teacher = newName;
    (e.coords || []).forEach(c => { if (c.teacher === oldName) c.teacher = newName; });
  });
  (obj.coEnseignementGroups || []).forEach(g => (g.members || []).forEach(m => { if (m.disc === disc && m.teacher === oldName) m.teacher = newName; }));
  return true;
}
function renameTeacherOp(d, from, to) {
  if (!renameCore(d, from, to)) return false;
  journal.push({ k: 'trename', disc: d, from, to });
  save(); return true;
}
function removeTeacherCore(d, name) {   // uniquement pour annuler un ajout fait sur le téléphone
  const data = store()[d]; if (!data) return;
  data.teachers = data.teachers.filter(t => t !== name);
  if (data.apports) delete data.apports[name];
  if (data.ares) delete data.ares[name];
  Object.keys(store()).forEach(k => (store()[k].services || []).forEach(sv => { if (sv.allocations) delete sv.allocations[name]; }));
}
function revertOp(o) {
  const data = store()[o.disc]; if (!data) return;
  if (o.k === 'note') { if ((o.from || '').trim()) data.note = o.from; else delete data.note; }
  else if (o.k === 'alloc') { const sv = data.services[o.sIndex]; if (sv && sv.allocations) sv.allocations[o.teacher] = o.from; }
  else if (o.k === 'tors') { if (!data.apports) data.apports = {}; data.apports[o.teacher] = o.from; }
  else if (o.k === 'trename') renameCore(o.disc, o.to, o.from);
  else if (o.k === 'tadd') removeTeacherCore(o.disc, o.name);
}

  openSheet(`<div class="sh-head"><strong>Nouvel enseignant · ${esc(d)}</strong><button class="back" onclick="closeSheet()">Fermer</button></div>
    <label class="lbl">Nom et prénom</label><input id="tname" class="txt" placeholder="DUPONT Marie" autocapitalize="characters" autocomplete="off">
    <label class="lbl">ORS (heures par semaine)</label><input id="tors" class="txt" type="text" inputmode="decimal" value="18">
    <div id="terr" class="err"></div>
    <button class="btn" onclick="saveNewTeacher()">Ajouter</button>`);
}
function saveNewTeacher() {
  const { d } = sheet, name = $('tname').value.trim(), ors = parseH($('tors').value);
  if (!name) { $('terr').textContent = 'Le nom est obligatoire.'; return; }
  if (!addTeacherOp(d, name, ors)) { $('terr').textContent = 'Un enseignant porte déjà ce nom dans cette discipline.'; return; }
  closeSheet(); toast('Enseignant ajouté');
}

// ───────── Fichiers ─────────
function askOpen() {
  if (nDirty() && !confirm('Des modifications n\'ont pas été exportées. Ouvrir un autre fichier les effacera. Continuer ?')) return;
  $('fileInput').click();
}
$('fileInput').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result);
      if (!o || typeof o !== 'object' || !o.dataStore) throw new Error('format');
      obj = o; fileName = f.name; journal = [];
      loadedAt = new Date().toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' });
      ui = { tab: 'home', disc: null, teacher: null, discTab: 'services', q: '', tq: '' };
      persist(); render(); toast('Fichier chargé');
    } catch (err) { alert('Ce fichier n\'est pas une sauvegarde VectisDHG Autonomie valide.'); }
  };
  r.readAsText(f); e.target.value = '';
});
async function shareText(text, name) {
  const file = new File([text], name, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function exportFile() { return shareText(JSON.stringify(obj, null, 2), fileName || 'DHG.json'); }
function exportDelta() {
  if (!journal.length) return;
  const ep = (obj.epleIdentity || {});
  const now = new Date(), p = n => String(n).padStart(2, '0');
  const payload = { format: 'vectis-modifications', version: 1, createdAt: now.toISOString(), source: 'VectisDHG Compagnon', sourceFile: fileName, eple: { name: ep.name || '', uai: ep.uai || '' }, ops: journal };
  return shareText(JSON.stringify(payload, null, 2), `Modifications_Compagnon_${now.getFullYear()}-${p(now.getMonth() + 1)}-${p(now.getDate())}_${p(now.getHours())}h${p(now.getMinutes())}.json`);
}

// ───────── Démarrage ─────────
restore();
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
